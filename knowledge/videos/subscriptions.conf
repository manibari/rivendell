# 訂閱清單 — channel-scraper 讀這份檔
# 格式: NAME | KIND | SOURCE | LIMIT
#   KIND   youtube | podcast | bilibili
#   SOURCE youtube  → UCxxxx… 頻道 ID、@handle 或頻道網址
#          podcast  → RSS/Atom feed 網址
#          bilibili → UP 主 uid（數字）或 space.bilibili.com 網址
#   LIMIT  單次最多排入幾支新片（可省略，預設 5）
# 井字號開頭是註解。新訂閱第一次掃描只會「建基準線」不回補舊片，
# 要回補用：feed_scan.py scan --sub "<名稱>" --backfill 3
#
# 加訂閱：feed_scan.py add youtube @handle "頻道名"（會自動附加到這裡）
# 退訂：把該行刪掉或註解掉；已看過的紀錄留在 subscriptions-state.json，重訂不會重抓
#
# ── 範例（取消註解即生效）─────────────────────────────────
# Matt Pocock | youtube  | @mattpocockuk                    | 5
# 极客湾       | bilibili | 25876945                         | 3
# Lex Fridman | podcast  | https://lexfridman.com/feed/podcast/ | 2
最佳拍档 | youtube | UCGWYKICLOE8Wxy7q3eYXmPA | 3
