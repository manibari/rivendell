# Port allocation registry — one line per claimed port
# Format: PORT | PROJECT | SERVICE | OWNER | NOTES
#
# WHAT THIS IS: a record of INTENT — which project owns which port, even when
# the service is not running. That is the one fact you cannot derive: `lsof`
# only sees what is alive right now, so a stopped service looks identical to a
# free port, and the next project happily takes it.
#
# WHAT THIS IS NOT: a source of truth about what is running. The kernel is.
# `sk check ports` treats live listeners as reality and this file as intent,
# then reports the difference. Never edit this file to make a check pass —
# fix the service, or register the port honestly.
#
# Ports are NOT enforced. Nothing can enforce them: launchd, docker, a stray
# `npm run dev`, and another project's script all bind ports without asking.
# Enforcement is the kernel returning EADDRINUSE. This file exists so that
# collisions are chosen against, not discovered at 3am.
#
# Lines starting with # are comments. Blank lines ignored.
# NOTE: avoid apostrophes — several parsers pipe raw lines through `xargs`.
#
# OWNER tells the checker how to recognise the rightful occupant of a live port
# (platform/deployment/port_registry.py):
#   ~/Code/X            listener working dir, or docker compose working_dir, is under it
#   docker:<container>  that container publishes the port
#   app:<prefix>        listener command starts with <prefix> (desktop apps)
#   -                   not checked
# Two projects claiming one port is shown as a CONFLICT on purpose: it means
# only one of them can start. Resolve it by moving one, never by deleting a line.
#
# Full inventory taken 2026-09-27 from lsof + docker + launchd + each repo README.
#
# ─── Numbering rule (Peter 2026-09-27) ───
# Every project gets a two-digit id PP. Its ports are  R PP i :
#   R  3 web frontend | 8 HTTP service (API, gateway, geo/route engine)
#      5 PostgreSQL   | 6 Redis | 9 object storage / consoles
#   i  0 main service, 1-9 second frontend, dev copy, sub-API
# e.g. id 15 -> 3150 web, 8150 api, 5150 db. A new project claims the next free
# id below with an @id line, then its ports follow; `sk check ports` flags any
# port that does not match its project id.
# Ids never issued (they would land on system ports): 00 for R5 (AirPlay 5000),
# 28 (3283 ARD), 37 (6379), 43 (5432 homebrew), 46 (6463 Discord).
#
# @id lines:  @id | PP | PROJECT

