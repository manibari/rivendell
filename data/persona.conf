# persona.conf — 助理人格註冊表與啟用指標
# 消費者：gateway/server.py、bin/sk-dispatch-lib、bin/sk-mail-triage-cron、
#         scripts/dispatch-lib.py、dashboard /avatar 頁
# 格式：扁平 dotted key（bash 用 grep/cut 解析）。檔內禁用撇號（同 agents.conf 警語）。
# active 由 gateway POST /persona 或手動改；engine = codex | claude | openai-api | anthropic-api

active = lindir
engine = codex

lindir.display_name = 林迪
lindir.gender = m
lindir.voice = zh-TW-YunJheNeural
lindir.vrm = /avatar/models/male.vrm
lindir.file = profiles/personas/lindir.md

miriel.display_name = 米瑞爾
miriel.gender = f
miriel.voice = zh-TW-HsiaoChenNeural
miriel.vrm = /avatar/models/female.vrm
miriel.file = profiles/personas/miriel.md
