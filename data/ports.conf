# Port allocation registry — one line per claimed port
# Format: PORT | PROJECT | SERVICE | NOTES
#
# WHAT THIS IS: a record of INTENT — which project owns which port, even when
# the service is not running. That is the one fact you cannot derive: `lsof`
# only sees what is alive right now, so a stopped service looks identical to a
# free port, and the next project happily takes it.
#
# WHAT THIS IS NOT: a source of truth about what is running. The kernel is.
# `sk check ports` treats live listeners as reality and this file as intent,
# then reports the difference. Never edit this file to make a check pass —
# fix the service, or register the port honestly.
#
# Ports are NOT enforced. Nothing can enforce them: launchd, docker, a stray
# `npm run dev`, and another project's script all bind ports without asking.
# Enforcement is the kernel returning EADDRINUSE. This file exists so that
# collisions are chosen against, not discovered at 3am.
#
# Lines starting with # are comments. Blank lines ignored.
# NOTE: avoid apostrophes — several parsers pipe raw lines through `xargs`.

# ─── rivendell (this repo) ───
8000 | rivendell   | dashboard-api      | FastAPI, launchd com.sk.dashboard.api
3000 | rivendell   | dashboard-web      | Next.js, launchd com.sk.dashboard.web

