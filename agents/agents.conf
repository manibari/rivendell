# Agent definitions — one per line
# Format: LABEL | PROJECT_REL_PATH | SCRIPT | SCHEDULE_TYPE | SCHEDULE_VALUE | LOG_DIR_REL | EXTRA_ARGS
#
# PROJECT_REL_PATH: relative to the parent dir of rivendell (override: SK_PROJECTS_DIR)
#                   NOTE: avoid apostrophes anywhere in this file — several
#                   parsers pipe raw lines through `xargs`, which treats a lone
#                   ' as an unterminated quote and aborts.
# SCHEDULE_TYPE:    interval | calendar | calendar_multi
# SCHEDULE_VALUE:
#   interval       → seconds (e.g. 28800)
#   calendar       → H:MM or W:H:MM (W=weekday 0-6)
#   calendar_multi → W1:H:MM,W2:H:MM
# LOG_DIR_REL:     relative to the project dir
# EXTRA_ARGS:      passed to the script (optional)
#
# Lines starting with # are comments. Blank lines ignored.

# ─── Rivendell agents ───
com.sk.agent.rivendell.harvest        | rivendell | bin/sk-harvest-cron        | interval | 28800  | reports
com.sk.agent.rivendell.maintain       | rivendell | bin/sk-maintain-cron       | calendar | 22:00  | reports
com.sk.agent.rivendell.tester         | rivendell | bin/sk-tester-cron         | calendar | 6:00   | reports
com.sk.agent.rivendell.doctor         | rivendell | bin/sk-agent-doctor        | calendar | 7:00   | reports
com.sk.agent.rivendell.symlink-fix    | rivendell | bin/sk-deploy-symlink-fix  | calendar | 5:30   | reports
com.sk.agent.rivendell.workflow-retro | rivendell | bin/sk-workflow-retro-cron | calendar | 0:23:00 | reports
com.sk.agent.rivendell.janitor        | rivendell | bin/sk-reports-janitor     | calendar | 0:3:00  | reports
com.sk.agent.rivendell.token-snapshot | rivendell | bin/sk-token-snapshot      | calendar | 2:30    | reports
com.sk.agent.rivendell.ssot-drift     | rivendell | bin/sk-ssot-drift-cron     | calendar | 3:00    | reports
com.sk.agent.rivendell.disk-monitor   | rivendell | bin/sk-disk-monitor-cron   | calendar | 3:30    | reports
com.sk.agent.rivendell.facts          | rivendell | bin/sk-facts-cron          | calendar | 21:30   | reports
com.sk.agent.rivendell.mail-triage    | rivendell | bin/sk-mail-triage-cron    | calendar | 7:45    | reports

