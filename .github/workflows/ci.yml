# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (lint + tests + import check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: an unpinned ruff means the lint bar moves without a commit here.
      # Bump deliberately, and run `ruff check apps/dashboard-api/` locally at
      # the same version before you do. Rule set lives in apps/dashboard-api/ruff.toml.
      - run: pip install -r apps/dashboard-api/requirements.txt ruff==0.16.6
      - run: ruff check apps/dashboard-api/
      - name: Run backend tests
        working-directory: apps/dashboard-api
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run shared library tests
        run: PYTHONPATH=apps/dashboard-legacy python -m unittest discover -s apps/dashboard-legacy/tests -p 'test_*.py'
      - name: Smoke test — verify server imports
        working-directory: apps/dashboard-api
        run: python -c "from server import app; print('OK')"

  skills:
    name: Skill structure validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: |
          fail=0
          for skill_md in skills/*/*/SKILL.md; do
            dir="$(dirname "$skill_md")"
            name="$(basename "$dir")"
            if ! head -20 "$skill_md" | grep -q '^name:'; then
              echo "FAIL: $skill_md — missing name"
              fail=$((fail + 1))
            fi
            if ! head -20 "$skill_md" | grep -q '^description:'; then
              echo "FAIL: $skill_md — missing description"
              fail=$((fail + 1))
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "$fail skill(s) failed validation"
            exit 1
          fi
          echo "All skills passed"
